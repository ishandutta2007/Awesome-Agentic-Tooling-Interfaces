<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="50%" stop-color="#0e1726"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#34d399"/></linearGradient><linearGradient id="pulseGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes floatA{0%{transform:translate(0,0)}}@keyframes floatB{0%{transform:translate(0,0)}}@keyframes pulseScale{0%{transform:scale(.95);opacity:.35}}@keyframes driftLeft{0%{transform:translateX(0)}}@keyframes driftRight{0%{transform:translateX(0)}}@keyframes driftUp{0%{transform:translateY(0)}}.bg-grid{stroke:#1e293b;stroke-width:.5;stroke-opacity:.4}.orbit-dot-1{animation:floatA 7s ease-in-out infinite alternate}.orbit-dot-2{animation:floatB 9s ease-in-out infinite alternate}.pulse-ring{transform-origin:600px 180px;animation:pulseScale 6s ease-in-out infinite alternate}.chip-anim-1{animation:driftLeft 8s ease-in-out infinite alternate}.chip-anim-2{animation:driftRight 10s ease-in-out infinite alternate}.chip-anim-3{animation:driftUp 7s ease-in-out infinite alternate}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.5" rx="16"/><g class="bg-grid"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200"