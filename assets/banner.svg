<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg-grid { stroke: #1e293b; stroke-width: 0.5; stroke-opacity: 0.4; }
      .orbit-dot-1 {
        animation: floatA 7s ease-in-out infinite alternate;
      }
      .orbit-dot-2 {
        animation: floatB 9s ease-in-out infinite alternate;
      }
      .pulse-ring {
        transform-origin: 600px 180px;
        animation: pulseScale 6s ease-in-out infinite alternate;
      }
      .chip-anim-1 {
        animation: driftLeft 8s ease-in-out infinite alternate;
      }
      .chip-anim-2 {
        animation: driftRight 10s ease-in-out infinite alternate;
      }
      .chip-anim-3 {
        animation: driftUp 7s ease-in-out infinite alternate;
      }
      @keyframes floatA {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(30px, -20px); }
      }
      @keyframes floatB {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-25px, 25px); }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.95); opacity: 0.35; }
        100% { transform: scale(1.05); opacity: 0.65; }
      }
      @keyframes driftLeft {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-18px); }
      }
      @keyframes driftRight {
        0% { transform: translateX(0px); }
        100% { transform: translateX(20px); }
      }
      @keyframes driftUp {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Dynamic Background Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic Glowing Orbits (Behind Text) -->
  <ellipse class="pulse-ring" cx="600" cy="180" rx="420" ry="120" fill="url(#pulseGlow)" stroke="#818cf8" stroke-width="1" stroke-dasharray="6,8" stroke-opacity="0.4"/>
  <circle class="orbit-dot-1" cx="240" cy="90" r="140" fill="#3b82f6" fill-opacity="0.08" filter="url(#glow)"/>
  <circle class="orbit-dot-2" cx="960" cy="270" r="160" fill="#8b5cf6" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Interactive Floating Chips/Nodes (positioned nicely in lower background) -->
  <g class="chip-anim-1" opacity="0.85">
    <rect x="80" y="275" width="170" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="100" cy="292" r="5" fill="#38bdf8"/>
    <text x="115" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">🤖 Autonomous Agents</text>
  </g>

  <g class="chip-anim-2" opacity="0.85">
    <rect x="525" y="275" width="150" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="545" cy="292" r="5" fill="#a855f7"/>
    <text x="560" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d8b4fe">🌐 Computer-Use</text>
  </g>

  <g class="chip-anim-3" opacity="0.85">
    <rect x="940" y="275" width="180" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <circle cx="960" cy="292" r="5" fill="#34d399"/>
    <text x="975" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">⚡ Agent-Native APIs</text>
  </g>

  <!-- High-Contrast Foreground Branding & Typography -->
  <g id="foreground-branding">
    <!-- Super-title Tag -->
    <rect x="470" y="42" width="260" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="61" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#c7d2fe">TOP CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)" filter="url(#glow)">Awesome Agentic Tooling</text>

    <!-- Subtitle -->
    <text x="600" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f8fafc">Agent-Native Interfaces, Multi-Agent Frameworks &amp; Computer-Use Systems</text>

    <!-- Tagline & Description -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Tracking Industry Leaders, Autonomous Software Engineers, Enterprise CX &amp; Open-Source Runtimes</text>
  </g>
</svg>
